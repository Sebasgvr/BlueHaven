# Stack efímero de integración; no es una instalación de Supabase para producción.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: bluehaven_test
    volumes:
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:bluehaven_test@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:8080
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:8080/**
      GOTRUE_JWT_SECRET: bluehaven-local-test-secret-at-least-32-chars
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
  rest:
    image: postgrest/postgrest:v14.18
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:bluehaven_test@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: bluehaven-local-test-secret-at-least-32-chars
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:54321:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [auth,rest]
