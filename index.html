<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Haven</title>
    <meta name="theme-color" content="#102d38" />
    <link
      rel="preload"
      href="textures/fuentes/PressStart2P.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/tema-lago.css" />
    <link rel="icon" href="textures/LogoBlueHaven.png" />
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var r of regs) r.unregister();
        });
      }
      if ("caches" in window) {
        caches.keys().then(function (keys) {
          for (var k of keys) caches.delete(k);
        });
      }
    </script>
  </head>

  <body>
    <!-- Pantalla de login/registro, tapa todo hasta autenticarse -->
    <div id="pantalla-auth">
      <div class="fondo-olas" aria-hidden="true">
        <div class="ola ola-1"></div>
        <div class="ola ola-2"></div>
      </div>

      <div class="caja-auth">
        <div class="marca">
          <span class="marca-icono" aria-hidden="true">🎣</span>
          <h1 class="marca-titulo">BlueHaven</h1>
          <img src="textures/LogoBlueHaven.png" alt="" class="logo-juego" />
          <p class="marca-tagline">Explorá. Pescá. Aprendé.</p>
        </div>

        <div class="tabs" role="tablist">
          <button
            type="button"
            id="tab-login"
            class="tab activo"
            onclick="mostrarLogin()"
          >
            Iniciar sesión
          </button>
          <button
            type="button"
            id="tab-registro"
            class="tab"
            onclick="mostrarRegistro()"
          >
            Crear cuenta
          </button>
        </div>

        <form id="form-login" class="form-auth">
          <label class="campo">
            <span>Email</span>
            <input
              type="email"
              id="login-usuario"
              autocomplete="email"
              required
            />
          </label>
          <label class="campo">
            <span>Contraseña</span>
            <input
              type="password"
              id="login-password"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit" class="boton-principal">Entrar al agua</button>
          <p class="error" id="login-error"></p>
          <button type="button" id="boton-invitado" class="boton-secundario">
            Jugar sin cuenta
          </button>
          <small>El progreso de invitado se guarda en este navegador.</small>
        </form>

        <form id="form-registro" class="form-auth" style="display: none">
          <label class="campo">
            <span>Usuario</span>
            <input
              type="text"
              id="reg-usuario"
              maxlength="50"
              autocomplete="username"
              required
            />
            <small>Nombre visible en el ranking público.</small>
          </label>
          <label class="campo">
            <span>Email</span>
            <input type="email" id="reg-email" autocomplete="email" required />
          </label>
          <label class="campo">
            <span>Contraseña</span>
            <input
              type="password"
              id="reg-password"
              autocomplete="new-password"
              minlength="6"
              required
            />
            <small>Mínimo 6 caracteres</small>
          </label>
          <button type="submit" class="boton-principal">Crear mi cuenta</button>
          <p class="error" id="reg-error"></p>
        </form>
      </div>
    </div>

    <div id="barra-juego" hidden>
      <div class="barra-botones">
        <button id="boton-ajustes" type="button">⚙ Ajustes</button>
        <button id="boton-tutorial" type="button">📖 Tutorial</button>
      </div>
      <span id="estado-guardado" aria-live="polite"></span>
    </div>
    <dialog id="ajustes">
      <form method="dialog">
        <h2>Ajustes del juego</h2>
        <label
          >Calidad gráfica
          <select id="calidad-grafica">
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
          </select></label
        ><label
          ><input type="checkbox" id="mostrar-fps" /> Mostrar rendimiento</label
        ><label for="volumen-general"
          >Volumen <output id="valor-volumen">100%</output></label
        ><input
          id="volumen-general"
          type="range"
          min="0"
          max="100"
          step="1"
        /><label><input id="silenciar-audio" type="checkbox" /> Silenciar</label
        ><label
          ><input id="musica-ambiente" type="checkbox" /> Música ambiente</label
        ><label
          ><input id="activar-tactil" type="checkbox" /> Controles
          táctiles</label
        >
        <p id="detalle-rendimiento"></p>
        <p>
          WASD: moverte · Mouse: mirar · F: pescar · I: mochila · L: especies ·
          Q: guía · H: tutoriales · Esc: ajustes · P: liberar/capturar cursor
        </p>
        <button id="abrir-tutorial-ajustes" type="button">
          📖 Tutorial y Minijuegos
        </button
        ><button id="cerrar-ajustes">Volver al juego</button
        ><button id="boton-logout" type="button" style="display: none">
          Cerrar sesión
        </button>
      </form>
    </dialog>
    <!-- Chatbot: guía de pesca conectada a la base de datos -->
    <button
      id="boton-chat"
      type="button"
      aria-expanded="false"
      aria-label="Abrir guía de pesca"
      title="Preguntar por peces (Q)"
    >
      🎣
    </button>

    <div
      id="panel-chat"
      class="oculto"
      role="dialog"
      aria-label="Guía de pesca"
    >
      <div class="chat-cabecera">
        <span class="chat-titulo">🎣 Guía de pesca</span>
        <button id="chat-cerrar" type="button" aria-label="Cerrar chat">
          ×
        </button>
      </div>
      <div id="chat-mensajes" class="chat-mensajes"></div>
      <div id="chat-sugerencias" class="chat-sugerencias"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input
          id="chat-input"
          type="text"
          placeholder="Escribí una pregunta…"
          maxlength="300"
        />
        <button type="submit" title="Enviar">➤</button>
      </form>
    </div>

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/three.min.js"></script>
    <script src="libraries/three-mesh-bvh.min.js"></script>
    <script src="libraries/GLTFLoader.js"></script>
    <script src="libraries/OBJLoader.js"></script>
    <script src="libraries/MTLLoader.js"></script>

    <script src="js/services/config.js"></script>
    <script src="libraries/supabase.min.js"></script>
    <script src="js/services/filtros-cuentas.js"></script>
    <script src="js/services/base-datos.js"></script>
    <script src="js/services/auth.js"></script>
    <script src="js/game/catalogo.js"></script>
    <script src="js/game/mapa.js"></script>
    <script src="js/game/jugador.js"></script>
    <script src="js/game/equipo.js"></script>
    <script src="js/game/calidad.js"></script>
    <script src="js/game/mecanicas.js"></script>
    <script src="js/game/minijuegos/minijuego-base.js"></script>
    <script src="js/game/minijuegos/minijuego-anillo.js"></script>
    <script src="js/game/minijuegos/minijuego-brujula.js"></script>
    <script src="js/game/minijuegos/minijuego-ritmo.js"></script>
    <script src="js/game/minijuegos/minijuego-esquiva.js"></script>
    <script src="js/game/minijuegos/minijuego-multietapa.js"></script>
    <script src="js/game/captura.js"></script>
    <script src="js/game/tarjeta-captura.js"></script>
    <script src="js/game/tienda.js"></script>
    <script src="js/ui/inventario.js"></script>
    <script src="js/ui/enciclopedia.js"></script>
    <script src="js/ui/bienvenida.js"></script>
    <script src="js/ui/tutorial.js"></script>
    <script src="js/ui/chatbot.js"></script>
    <script src="js/game/entorno.js"></script>
    <script src="js/game/terreno.js"></script>
    <script src="js/game/agua.js"></script>
    <script src="js/game/cana-3d.js"></script>
    <script src="js/game/vida-mundo.js"></script>
    <script src="js/ui/rendimiento.js"></script>
    <script src="js/ui/comercio.js"></script>
    <script src="js/audio/audio.js"></script>
    <script src="js/ui/dialogo-kiwifina.js"></script>
    <script src="js/ui/ranking.js"></script>
    <script src="js/ui/controles-tactiles.js"></script>
    <script src="js/game/sketch.js"></script>
  </body>
</html>
