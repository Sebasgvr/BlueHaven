server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ =404; }
  location ~ ^/(?:\.git|node_modules|tests|scripts|supabase|bd|docs)(?:/|$) { return 404; }
  location ~ \.(?:sql|md|json|yaml|yml|env|example)$ { return 404; }
  location ~ /\. { return 404; }
}
